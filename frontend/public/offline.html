<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4338ca" />
    <title>xDrishti is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6fa;
        --fg: #111827;
        --accent: #4338ca;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --fg: #e5e7eb;
          --accent: #a5b4fc;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>xDrishti</h1>
      <p>You are offline. xDrishti shows no data without a connection and keeps none on this device.</p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>
