# xDrishti — local stack on Podman Desktop. Start with deploy/xd-up.sh (it prepares secrets first).
# Docs: docs/design/17-deployment-and-operations.md · rules: deploy/CLAUDE.md
name: xdrishti

x-dotnet-env: &dotnet-env
  DOTNET_ENVIRONMENT: Production
  ASPNETCORE_ENVIRONMENT: Production
  Database__ConnectionString: Host=xd-db;Port=5432;Database=xdrishti;Username=xd_app
  Serilog__WriteTo__1__Name: Seq
  Serilog__WriteTo__1__Args__serverUrl: http://xd-seq:5341

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  xd-db:
    image: docker.io/timescale/timescaledb:2.30.2-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: xdrishti
      POSTGRES_USER: xd_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TIMESCALEDB_TELEMETRY: "off"
    secrets:
      - db_owner_password
      - source: db_app_password
        target: Database__Password
    volumes:
      - xd-db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [back]
    shm_size: 256m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U xd_owner -d xdrishti]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies EF Core migrations as the database owner, then exits.
  xd-migrate:
    image: localhost/xdrishti/api:${XD_VERSION:-0.1.0}
    command: [migrate]
    restart: "no"
    environment:
      <<: *dotnet-env
      Database__ConnectionString: Host=xd-db;Port=5432;Database=xdrishti;Username=xd_owner
    secrets:
      - source: db_owner_password
        target: Database__Password
      # Only the migration step reads the owner's credentials (to create the owner when none exists).
      - source: auth_owner_email
        target: Auth__Owner__Email
      - source: auth_owner_name
        target: Auth__Owner__Name
      - source: auth_owner_password
        target: Auth__Owner__Password
    networks: [back]
    pull_policy: never # uses the image built for xd-api (compose builds all images before starting)
    depends_on:
      xd-db: { condition: service_healthy }
    <<: *hardening

  # One-shot, on demand (`deploy/xd-up.sh --owner-reset`): replaces the owner's password from the secrets and
  # revokes every session. Runs as the runtime role (xd_app); not part of the normal stack (profile "tools").
  xd-owner-reset:
    image: localhost/xdrishti/api:${XD_VERSION:-0.1.0}
    command: [owner-reset]
    profiles: [tools]
    restart: "no"
    environment: *dotnet-env
    secrets:
      - source: db_app_password
        target: Database__Password
      - source: auth_owner_email
        target: Auth__Owner__Email
      - source: auth_owner_name
        target: Auth__Owner__Name
      - source: auth_owner_password
        target: Auth__Owner__Password
    networks: [back]
    pull_policy: never
    depends_on:
      xd-db: { condition: service_healthy }
    <<: *hardening

  xd-api:
    image: localhost/xdrishti/api:${XD_VERSION:-0.1.0}
    build:
      context: ../backend
      target: api
      args: { VERSION: "${XD_VERSION:-0.1.0}" }
    restart: unless-stopped
    environment:
      <<: *dotnet-env
      # Where the owner's browser reaches the app; Dhan redirects back to <this>/api/brokers/dhan/callback (ADR 0008, 0009).
      Brokers__PublicBaseUrl: http://localhost:${XD_HTTP_PORT:-8080}
      # Instrument master (ADR 0010): the API refreshes it from Dhan's public scrip master every day. First-start settings only (ADR 0018): read once, when the service has no row; after that the time and
      # the switch are changed on the Services screen and these are ignored. HH:mm India time; false starts the service paused.
      Instruments__AutoRefresh__Enabled: ${XD_INSTRUMENTS_AUTO_REFRESH:-true}
      Instruments__AutoRefresh__TimeIst: ${XD_INSTRUMENTS_REFRESH_TIME_IST:-08:45}
      # Holdings (ADR 0012): whether the API looks once a minute at the accounts whose own automatic refresh (Off / Every N minutes / Daily, set in the app,
      # off by default) is due; false disables every schedule. "Sync now" always works.
      Portfolio__AutoRefresh__Enabled: ${XD_PORTFOLIO_AUTO_REFRESH:-true}
      # Trades and ledger from Dhan (ADR 0025): first-start setting only (ADR 0018) of the "Portfolio trades & ledger" service (daily 16:30 IST on trading days); false starts it paused. After that it is
      # changed on the Services screen. "Sync now" per account always works.
      Portfolio__BrokerHistory__Enabled: ${XD_PORTFOLIO_BROKER_HISTORY:-true}
      # Market data (ADR 0016): the folder with the <SYMBOL>_1m.csv[.gz] files, mounted read-only below. Dhan Data API fetch: first fetch goes this many days
      # back, at most this many requests per second.
      Data__CsvFolder: /data/csv
      Data__Dhan__InitialDays: ${XD_DATA_DHAN_INITIAL_DAYS:-365}
      Data__Dhan__RequestsPerSecond: ${XD_DATA_DHAN_REQUESTS_PER_SECOND:-4}
    # The 1-minute CSV files (ADR 0016): read-only, the API never writes there. deploy/xd-up.sh creates the folder when it is missing.
    volumes:
      - ${XD_CSV_DIR:-../data/Stocks_CSV}:/data/csv:ro
    secrets:
      - source: db_app_password
        target: Database__Password
      # Key of the encrypted broker vault (accounts.broker_secrets, ADR 0008). Only the API and the live feed (ADR 0024) get it: the API refuses to start without it.
      - source: broker_vault_key
        target: BrokerVault__Key
    # egress: outbound only, to Dhan's consent endpoints (auth.dhan.co; ADR 0008, 0009), the read of the account's holdings (GET api.dhan.co/v2/holdings
    # with the stored access token; ADR 0012) and the two public instrument-master files (images.dhan.co, nsearchives.nseindia.com; ADR 0010).
    # The API's HTTP clients refuse every other endpoint (allow-lists); nothing is published on this network.
    networks: [back, egress]
    mem_limit: 1g
    depends_on:
      xd-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, dotnet, XDrishti.Api.dll, --healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    <<: *hardening

  xd-worker:
    image: localhost/xdrishti/worker:${XD_VERSION:-0.1.0}
    build:
      context: ../backend
      target: worker
      args: { VERSION: "${XD_VERSION:-0.1.0}" }
    restart: unless-stopped
    environment: *dotnet-env
    secrets:
      - source: db_app_password
        target: Database__Password
    networks: [back]
    mem_limit: 2g
    depends_on:
      xd-migrate: { condition: service_completed_successfully }
    <<: *hardening

  # The live feed (P2-10, ADR 0024): the Dhan WebSocket for the active set during market hours (09:00-15:35 IST on trading days; the window is the service
  # `live-feed` on the Services screen). It reads the Data account's token through the broker vault, so it gets the vault key like xd-api, and it writes
  # prices into the database only. Outbound to api-feed.dhan.co (wss) only: its client refuses every other endpoint. No published port.
  xd-feed:
    image: localhost/xdrishti/feed:${XD_VERSION:-0.1.0}
    build:
      context: ../backend
      target: feed
      args: { VERSION: "${XD_VERSION:-0.1.0}" }
    restart: unless-stopped
    environment: *dotnet-env
    secrets:
      - source: db_app_password
        target: Database__Password
      - source: broker_vault_key
        target: BrokerVault__Key
    networks: [back, egress]
    mem_limit: 256m
    # Shutdown ends the window run and sends a last heartbeat (up to ~30 s); the default 10 s would kill it and leave the run to be closed as interrupted.
    stop_grace_period: 30s
    depends_on:
      xd-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, dotnet, XDrishti.Feed.dll, --healthcheck]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3
    <<: *hardening

  xd-proxy:
    image: localhost/xdrishti/proxy:${XD_VERSION:-0.1.0}
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - 127.0.0.1:${XD_HTTP_PORT:-8080}:8080
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../docs/prototype:/srv-static/prototype:ro
      - ../docs/site:/srv-static/docs:ro
    tmpfs: ["/data:mode=1777", "/config:mode=1777"]
    networks: [front, back]
    mem_limit: 256m
    depends_on:
      xd-api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  xd-seq:
    image: docker.io/datalust/seq:2026.1.17182
    profiles: [ops]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - 127.0.0.1:${XD_SEQ_PORT:-5341}:80
    volumes:
      - xd-seq-data:/data
    networks: [front, back]
    mem_limit: 1g

networks:
  front: {}
  back:
    internal: true
  # Outbound internet for xd-api (Dhan sign-in, ADR 0008, 0009; instrument master files, ADR 0010) and xd-feed (the market-data WebSocket, ADR 0024). Not internal, no published ports, no other member.
  egress: {}

volumes:
  xd-db-data: {}
  xd-seq-data: {}

# Secret files are written from the macOS Keychain by deploy/xd-up.sh (never committed, never in images).
secrets:
  db_owner_password:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/db_owner_password
  db_app_password:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/db_app_password
  auth_owner_email:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/auth_owner_email
  auth_owner_name:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/auth_owner_name
  auth_owner_password:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/auth_owner_password
  broker_vault_key:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/broker_vault_key
