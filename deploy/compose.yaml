# xDrishti — local stack on Podman Desktop. Start with deploy/xd-up.sh (it prepares secrets first).
# Docs: docs/design/17-deployment-and-operations.md · rules: deploy/CLAUDE.md
name: xdrishti

x-dotnet-env: &dotnet-env
  DOTNET_ENVIRONMENT: Production
  ASPNETCORE_ENVIRONMENT: Production
  Database__ConnectionString: Host=xd-db;Port=5432;Database=xdrishti;Username=xd_app
  Serilog__WriteTo__1__Name: Seq
  Serilog__WriteTo__1__Args__serverUrl: http://xd-seq:5341

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  xd-db:
    image: docker.io/timescale/timescaledb:2.30.2-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: xdrishti
      POSTGRES_USER: xd_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TIMESCALEDB_TELEMETRY: "off"
    secrets:
      - db_owner_password
      - source: db_app_password
        target: Database__Password
    volumes:
      - xd-db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [back]
    shm_size: 256m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U xd_owner -d xdrishti]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies EF Core migrations as the database owner, then exits.
  xd-migrate:
    image: localhost/xdrishti/api:${XD_VERSION:-0.1.0}
    command: [migrate]
    restart: "no"
    environment:
      <<: *dotnet-env
      Database__ConnectionString: Host=xd-db;Port=5432;Database=xdrishti;Username=xd_owner
    secrets:
      - source: db_owner_password
        target: Database__Password
      # Only the migration step reads the owner's credentials (to create the owner when none exists).
      - source: auth_owner_email
        target: Auth__Owner__Email
      - source: auth_owner_name
        target: Auth__Owner__Name
      - source: auth_owner_password
        target: Auth__Owner__Password
      # The passwords of the assistant's two read-only logins (P9-02, ADR 0137): migrate gives the roles xd_mcp_read and xd_mcp_sql their login from these files; absent or empty = the roles stay NOLOGIN.
      - source: db_mcp_read_password
        target: AiRoles__ReadPassword
      - source: db_mcp_sql_password
        target: AiRoles__SqlPassword
    networks: [back]
    pull_policy: never # uses the image built for xd-api (compose builds all images before starting)
    depends_on:
      xd-db: { condition: service_healthy }
    <<: *hardening

  # One-shot, on demand (`deploy/xd-up.sh --owner-reset`): replaces the owner's password from the secrets and
  # revokes every session. Runs as the runtime role (xd_app); not part of the normal stack (profile "tools").
  xd-owner-reset:
    image: localhost/xdrishti/api:${XD_VERSION:-0.1.0}
    command: [owner-reset]
    profiles: [tools]
    restart: "no"
    environment: *dotnet-env
    secrets:
      - source: db_app_password
        target: Database__Password
      - source: auth_owner_email
        target: Auth__Owner__Email
      - source: auth_owner_name
        target: Auth__Owner__Name
      - source: auth_owner_password
        target: Auth__Owner__Password
    networks: [back]
    pull_policy: never
    depends_on:
      xd-db: { condition: service_healthy }
    <<: *hardening

  xd-api:
    image: localhost/xdrishti/api:${XD_VERSION:-0.1.0}
    build:
      context: ../backend
      target: api
      args: { VERSION: "${XD_VERSION:-0.1.0}" }
    restart: unless-stopped
    environment:
      <<: *dotnet-env
      # Where the owner's browser reaches the app; Dhan redirects back to <this>/api/brokers/dhan/callback (ADR 0008, 0009).
      Brokers__PublicBaseUrl: http://localhost:${XD_HTTP_PORT:-8080}
      # Instrument master (ADR 0010): the API refreshes it from Dhan's public scrip master every day. First-start settings only (ADR 0018): read once, when the service has no row; after that the time and
      # the switch are changed on the Services screen and these are ignored. HH:mm India time; false starts the service paused.
      Instruments__AutoRefresh__Enabled: ${XD_INSTRUMENTS_AUTO_REFRESH:-true}
      Instruments__AutoRefresh__TimeIst: ${XD_INSTRUMENTS_REFRESH_TIME_IST:-08:45}
      # Holdings (ADR 0012): whether the API looks once a minute at the accounts whose own automatic refresh (Off / Every N minutes / Daily, set in the app,
      # off by default) is due; false disables every schedule. "Sync now" always works.
      Portfolio__AutoRefresh__Enabled: ${XD_PORTFOLIO_AUTO_REFRESH:-true}
      # Trades and ledger from Dhan (ADR 0025): first-start setting only (ADR 0018) of the "Portfolio trades & ledger" service (daily 16:30 IST on trading days); false starts it paused. After that it is
      # changed on the Services screen. "Sync now" per account always works.
      Portfolio__BrokerHistory__Enabled: ${XD_PORTFOLIO_BROKER_HISTORY:-true}
      # Self-healing syncs (ADR 0027): the waits before the quiet retries of a sync that failed for a reason that may pass (minutes, comma-separated, inside the day; set but empty - XD_PORTFOLIO_HEAL_BACKOFF_MINUTES= - switches the retries off, unset keeps 1,5,15; the other two keep their default when empty), the failed days in a row after
      # which the bell hears of a failing sync (what only the owner can fix is told at once), and how many years back the nightly deepening of the trade history reads at most (0 switches it off), and how many days a resolved bell item is kept before it is deleted (ADR 0030).
      Portfolio__Heal__RetryBackoffMinutes: ${XD_PORTFOLIO_HEAL_BACKOFF_MINUTES-1,5,15}
      Portfolio__Heal__PersistDays: ${XD_PORTFOLIO_HEAL_PERSIST_DAYS:-2}
      Portfolio__Heal__DeepenMaxYears: ${XD_PORTFOLIO_HEAL_DEEPEN_YEARS:-8}
      Portfolio__Heal__AttentionRetentionDays: ${XD_PORTFOLIO_HEAL_ATTENTION_DAYS:-30}
      # Price-crossing alerts and post-trade prompts (P7-20, ADR 0115): alerts only, no order. OFF by default. xd-api (notice source, plan-screen read, the post-trade-prompts service) and xd-feed (the observer) must have the SAME value: set XD_TICKET_ALERTS once.
      Planning__TicketAlerts__Enabled: ${XD_TICKET_ALERTS:-false}
      # The live writes of the web (P11-00, P11-05, ADR 0147): OFF by default. While false, the compliance record (POST /api/live-trading/compliance) is refused with 403 live.capability_off; it also needs the owner's fresh password.
      Live__Writes__Enabled: ${XD_LIVE_WRITES_ENABLED:-false}
      # The live capture (P11-01, ADR 0149): read-only GETs of the day's trade book and order book. Both OFF by default. The first seeds the live-capture and live-settle services (paused when false); the second decides whether the order book is read at all.
      Live__Capture__Enabled: ${XD_LIVE_CAPTURE_ENABLED:-false}
      Live__Capture__OrderBook__Enabled: ${XD_LIVE_CAPTURE_ORDER_BOOK:-false}
      # Market data (ADR 0016): the folder with the <SYMBOL>_1m.csv[.gz] files, mounted read-only below. Dhan Data API fetch: first fetch goes this many days
      # back, at most this many requests per second.
      Data__CsvFolder: /data/csv
      Data__Dhan__InitialDays: ${XD_DATA_DHAN_INITIAL_DAYS:-365}
      Data__Dhan__InitialDaysIndex: ${XD_DATA_DHAN_INITIAL_DAYS_INDEX:-1825}
      Data__Dhan__RequestsPerSecond: ${XD_DATA_DHAN_REQUESTS_PER_SECOND:-4}
      # Local model server (P9-01, ADR 0005, 0136): the API only LOOKS at xd-llm (GET /health, /v1/models, /props), and only while this deployment flag is true. OFF by default; the model server itself is started by the owner
      # (scripts/xd-ai.sh start) and is not part of the stack. xd-llm is on the internal `back` network: no route out.
      Assistant__Llm__Enabled: ${XD_ASSISTANT_LLM:-false}
      Assistant__Llm__BaseUrl: http://xd-llm:8080/v1
      # The read-only tool server (P9-02, ADR 0137): where the chat endpoint of P9-03 reaches it (only while the assistant is switched on by the owner, the model server is ready and a question is asked).
      Assistant__Mcp__Url: http://xd-mcp:8080/mcp
      # The eval files (P9-09, ADR 0143), read only: the status of the accepted eval run compares their hashes. xd-api holds no eval token and cannot reach the eval's tool server.
      Eval__Folder: /data/eval-files
    # The 1-minute CSV files (ADR 0016): read-only, the API never writes there. deploy/xd-up.sh creates the folder when it is missing.
    volumes:
      - ${XD_CSV_DIR:-../data/Stocks_CSV}:/data/csv:ro
      - ../eval:/data/eval-files:ro
    secrets:
      - source: db_app_password
        target: Database__Password
      # Key of the encrypted broker vault (accounts.broker_secrets, ADR 0008). Only the API and the live feed (ADR 0024) get it: the API refuses to start without it.
      - source: broker_vault_key
        target: BrokerVault__Key
      # Key of the local model server (xd-llm checks it; the API sends it). Same file as xd-llm's.
      - source: llm_api_key
        target: Assistant__Llm__ApiKey
      # Bearer token for the tool server (xd-mcp checks it; the API sends it from P9-03). Same file as xd-mcp's.
      - source: mcp_token
        target: Assistant__Mcp__Token
    # egress: outbound only, to Dhan's consent endpoints (auth.dhan.co; ADR 0008, 0009), the read of the account's holdings (GET api.dhan.co/v2/holdings
    # with the stored access token; ADR 0012) and the two public instrument-master files (images.dhan.co, nsearchives.nseindia.com; ADR 0010).
    # The API's HTTP clients refuse every other endpoint (allow-lists); nothing is published on this network.
    networks: [back, egress]
    mem_limit: 1g
    depends_on:
      xd-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, dotnet, XDrishti.Api.dll, --healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    <<: *hardening

  xd-worker:
    image: localhost/xdrishti/worker:${XD_VERSION:-0.1.0}
    build:
      context: ../backend
      target: worker
      args: { VERSION: "${XD_VERSION:-0.1.0}" }
    restart: unless-stopped
    environment: *dotnet-env
    secrets:
      - source: db_app_password
        target: Database__Password
    networks: [back]
    mem_limit: 2g
    depends_on:
      xd-migrate: { condition: service_completed_successfully }
    <<: *hardening

  # The live feed (P2-10, ADR 0024): the Dhan WebSocket for the active set during market hours (09:00-15:35 IST on trading days; the window is the service
  # `live-feed` on the Services screen). It reads the Data account's token through the broker vault, so it gets the vault key like xd-api, and it writes
  # prices into the database only. Outbound to api-feed.dhan.co (wss) only: its client refuses every other endpoint. No published port.
  xd-feed:
    image: localhost/xdrishti/feed:${XD_VERSION:-0.1.0}
    build:
      context: ../backend
      target: feed
      args: { VERSION: "${XD_VERSION:-0.1.0}" }
    restart: unless-stopped
    environment:
      <<: *dotnet-env
      # Must equal xd-api's value (same variable): the observer exists only while this is true (P7-20, ADR 0115).
      Planning__TicketAlerts__Enabled: ${XD_TICKET_ALERTS:-false}
      # The depth recorder (P7-16, ADR 0135): the deployment gate, OFF by default. Recording also needs the owner's switch (PUT /api/depth/recorder, password) and the resumed service depth-recorder.
      Depth__Enabled: ${XD_DEPTH_ENABLED:-false}
    secrets:
      - source: db_app_password
        target: Database__Password
      - source: broker_vault_key
        target: BrokerVault__Key
    networks: [back, egress]
    mem_limit: 256m
    # Shutdown ends the window run and sends a last heartbeat (up to ~30 s); the default 10 s would kill it and leave the run to be closed as interrupted.
    stop_grace_period: 30s
    depends_on:
      xd-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, dotnet, XDrishti.Feed.dll, --healthcheck]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3
    <<: *hardening

  xd-proxy:
    image: localhost/xdrishti/proxy:${XD_VERSION:-0.1.0}
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - 127.0.0.1:${XD_HTTP_PORT:-8080}:8080
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../docs/prototype:/srv-static/prototype:ro
      - ../docs/site:/srv-static/docs:ro
    tmpfs: ["/data:mode=1777", "/config:mode=1777"]
    networks: [front, back]
    mem_limit: 256m
    depends_on:
      xd-api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  xd-seq:
    image: docker.io/datalust/seq:2026.1.17182
    profiles: [ops]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - 127.0.0.1:${XD_SEQ_PORT:-5341}:80
    volumes:
      - xd-seq-data:/data
    networks: [front, back]
    mem_limit: 1g

  # The local model server (P9-01, ADR 0005, 0136): llama.cpp, GPU through libkrun (Vulkan "Venus", /dev/dri). Profile `ai` = never part of `xd-up.sh`; the owner starts and stops it with scripts/xd-ai.sh.
  # No published port and an internal network (no route out); the model files are mounted read-only and are loaded with -m (never -hf, so it never downloads); the only secret is its own API key.
  # deploy/CLAUDE.md rules for this block are checked by AiComposeRulesTests (part of scripts/check.sh).
  xd-llm:
    profiles: [ai]
    image: quay.io/ramalama/ramalama:0.25.0@sha256:d60dfda3113e127071d2b2679921c763d0eb7a0733596f68bf93a4ef1ca1216e
    restart: "no"
    user: "1000:1000"
    devices: ["/dev/dri:/dev/dri"]
    # Defaults keep `compose config` valid when the profile is not used; xd-ai.sh exports the real values. A missing file makes the server stop with an error, never answer.
    command:
      - llama-server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - /mnt/models/${XD_LLM_MODEL_FILE:-model_missing.gguf}
      - --alias
      - ${XD_LLM_ALIAS:-xd-main}
      - -c
      - "${XD_LLM_CTX:-16384}"
      - -ngl
      - "999"
      - -np
      - "1"
      - --jinja
      - --no-webui
    environment:
      HOME: /tmp
      LLAMA_ARG_API_KEY_FILE: /run/secrets/llm_api_key
      # JSON text exported by xd-ai.sh; the default is a valid JSON value because braces break a ":-" default.
      LLAMA_ARG_CHAT_TEMPLATE_KWARGS: ${XD_LLM_KWARGS:-null}
    secrets: [llm_api_key]
    volumes:
      - ${XD_MODELS_DIR:-../data/models-llm}:/mnt/models:ro
    networks: [back, ai-edge] # ai-edge: the Hermes PoC network (P9-10); a member of both, never a router
    mem_limit: 8g # PLACEHOLDER until measured (P9-01 AC 10, UNVERIFIED)
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 150s
      retries: 12 # 150 s + 12 x 10 s = 270 s, inside the 330 s that scripts/xd-ai.sh waits
    <<: *hardening

  # ---- The assistant eval (P9-09, ADR 0143). Profile `eval` = never part of `xd-up.sh`; the owner starts it with scripts/xd-eval.sh. Four services, none with a published port, all on the internal `back` network (no route out). ----
  # The fixture database `xdrishti_eval` is migrated by the same image and seeded from eval/fixture/fixture.json. The eval's tool server reads ONLY that database, as the same two read-only roles of P9-02; its own token is held by the
  # runner alone (never by xd-api, which keeps no eval token and no path to this server). Rules: deploy/CLAUDE.md, checked by EvalComposeRulesTests (part of scripts/check.sh).

  # One-shot: the migrations of the fixture database (no owner account is created: Migrate__SkipOwner).
  xd-migrate-eval:
    profiles: [eval]
    image: localhost/xdrishti/api:${XD_VERSION:-0.1.0}
    command: [migrate]
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: Host=xd-db;Port=5432;Database=xdrishti_eval;Username=xd_owner
      Migrate__SkipOwner: "true"
    secrets:
      - source: db_owner_password
        target: Database__Password
      - source: db_mcp_read_password
        target: AiRoles__ReadPassword
      - source: db_mcp_sql_password
        target: AiRoles__SqlPassword
    networks: [back]
    pull_policy: never
    depends_on:
      xd-db: { condition: service_healthy }
    <<: *hardening

  # The assistant's tool server over the FIXTURE database: xd-mcp's image, roles and hardening, another database and its own token (Mcp:Tokens:Eval).
  xd-mcp-eval:
    profiles: [eval]
    image: localhost/xdrishti/mcp:${XD_VERSION:-0.1.0}
    build:
      context: ../backend
      target: mcp
      args: { VERSION: "${XD_VERSION:-0.1.0}" }
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_ENVIRONMENT: Production
      Database__ReadConnectionString: Host=xd-db;Port=5432;Database=xdrishti_eval;Username=xd_mcp_read
      Database__SqlConnectionString: Host=xd-db;Port=5432;Database=xdrishti_eval;Username=xd_mcp_sql
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: http://xd-seq:5341
    secrets:
      - source: db_mcp_read_password
        target: Database__ReadPassword
      - source: db_mcp_sql_password
        target: Database__SqlPassword
      - source: eval_mcp_token
        target: Mcp__Tokens__Eval
      - source: mcp_token_hermes
        target: Mcp__Tokens__Hermes
    networks: [back, ai-edge]
    mem_limit: 512m
    depends_on:
      xd-db: { condition: service_healthy }
    healthcheck:
      test: [CMD, dotnet, XDrishti.Mcp.dll, --healthcheck]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3
    <<: *hardening

  # One-shot: `xd eval seed` writes the fixture into the empty, migrated xdrishti_eval as the database owner, and refuses any other database or one that holds data.
  xd-eval-seed:
    profiles: [eval]
    image: localhost/xdrishti/api:${XD_VERSION:-0.1.0}
    command: [xd, eval, seed]
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: Host=xd-db;Port=5432;Database=xdrishti_eval;Username=xd_owner
      Eval__SeedConnection: Host=xd-db;Port=5432;Database=xdrishti_eval;Username=xd_owner
      Eval__Folder: /data/eval-files
    secrets:
      - source: db_owner_password
        target: Database__Password
    volumes:
      - ../eval:/data/eval-files:ro
    networks: [back]
    pull_policy: never
    depends_on:
      xd-db: { condition: service_healthy }
    <<: *hardening

  # One-shot, the owner's verb: `xd eval run|grade|compare|accept|show` (scripts/xd-eval.sh). It asks the local model (xd-llm) questions of the fixture, with the tools of xd-mcp-eval, and writes only the assistant's audit rows (origin eval, fixture data) and the eval tables
  # of the production database as the runtime role. It reads no tool server but the eval's. Never started by a service, a job or an endpoint.
  xd-eval:
    profiles: [eval]
    image: localhost/xdrishti/api:${XD_VERSION:-0.1.0}
    command: [xd, eval, show]
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: Host=xd-db;Port=5432;Database=xdrishti;Username=xd_app
      Assistant__Llm__Enabled: "true"
      Assistant__Llm__BaseUrl: http://xd-llm:8080/v1
      Eval__Mcp__Url: http://xd-mcp-eval:8080/mcp
      Eval__Folder: /data/eval-files
    secrets:
      - source: db_app_password
        target: Database__Password
      - source: llm_api_key
        target: Assistant__Llm__ApiKey
      - source: eval_mcp_token
        target: Eval__Mcp__Token
    volumes:
      - ../eval:/data/eval-files:ro
    networks: [back]
    mem_limit: 1g
    pull_policy: never
    depends_on:
      xd-db: { condition: service_healthy }
    <<: *hardening

  # The assistant's read-only tool server (P9-02, ADR 0137): four read tools over MCP (Streamable HTTP, stateless, bearer token). Profile `ai` = never part of `xd-up.sh`; the owner starts it with scripts/xd-ai.sh. It logs in as the roles xd_mcp_read and
  # xd_mcp_sql, which can SELECT from the reviewed views of schema `aiv` and nothing else; it holds none of the application's credentials. No published port, internal network only; the only secrets are its two passwords and its token.
  # deploy/CLAUDE.md rules for this block are checked by McpComposeRulesTests (part of scripts/check.sh).
  xd-mcp:
    profiles: [ai]
    image: localhost/xdrishti/mcp:${XD_VERSION:-0.1.0}
    build:
      context: ../backend
      target: mcp
      args: { VERSION: "${XD_VERSION:-0.1.0}" }
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_ENVIRONMENT: Production
      Database__ReadConnectionString: Host=xd-db;Port=5432;Database=xdrishti;Username=xd_mcp_read
      Database__SqlConnectionString: Host=xd-db;Port=5432;Database=xdrishti;Username=xd_mcp_sql
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: http://xd-seq:5341
    secrets:
      - source: db_mcp_read_password
        target: Database__ReadPassword
      - source: db_mcp_sql_password
        target: Database__SqlPassword
      - source: mcp_token
        target: Mcp__Tokens__Api
      - source: mcp_token_hermes
        target: Mcp__Tokens__Hermes
    networks: [back, ai-edge]
    mem_limit: 512m
    depends_on:
      xd-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, dotnet, XDrishti.Mcp.dll, --healthcheck]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3
    <<: *hardening

  # ---- The Hermes Agent PoC (P9-10, ADR 0144). Profile `hermes` = NEVER started by xd-up.sh, xd-down.sh, xd-ai.sh or xd-eval.sh; only the owner's `scripts/hermes-poc.sh up`. Third-party, self-modifying agent: it sits alone on the internal
  # network `ai-edge` with xd-llm and xd-mcp (no route to the database, the API or the internet), holds exactly two credentials, publishes no port, and writes only to its own volume. Rules: deploy/CLAUDE.md, checked by HermesComposeRulesTests. ----
  # UNVERIFIED until check H-1 runs: that the image starts read-only, non-root, with every capability dropped and no messaging platform; the healthcheck command.
  xd-hermes:
    profiles: [hermes]
    build:
      context: ./hermes
    image: localhost/xdrishti/hermes:${XD_VERSION:-0.1.0}
    restart: "no"
    command: [gateway, run] # UNVERIFIED: the scheduler host without a platform
    user: "10000:10000"
    read_only: true
    tmpfs: [/tmp, /run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g # PLACEHOLDER until H-10
    pids_limit: 256
    cpus: 2
    environment:
      XD_MCP_URL: ${XD_HERMES_MCP_URL:-http://xd-mcp:8080/mcp}
    volumes:
      - xd-hermes-data:/opt/data
    secrets: [llm_api_key, mcp_token_hermes]
    networks: [ai-edge]
    healthcheck:
      test: [CMD, hermes, --version] # UNVERIFIED: the image's real health command is found in H-1
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

networks:
  front: {}
  back:
    internal: true
  # Outbound internet for xd-api (Dhan sign-in, ADR 0008, 0009; instrument master files, ADR 0010) and xd-feed (the market-data WebSocket, ADR 0024). Not internal, no published ports, no other member.
  egress: {}
  # The Hermes PoC network (P9-10): internal (no route out); only xd-hermes, xd-llm, xd-mcp and xd-mcp-eval are members.
  ai-edge:
    internal: true

volumes:
  xd-db-data: {}
  xd-seq-data: {}
  xd-hermes-data: {}

# Secret files are written from the macOS Keychain by deploy/xd-up.sh (never committed, never in images).
secrets:
  db_owner_password:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/db_owner_password
  db_app_password:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/db_app_password
  auth_owner_email:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/auth_owner_email
  auth_owner_name:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/auth_owner_name
  auth_owner_password:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/auth_owner_password
  broker_vault_key:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/broker_vault_key
  llm_api_key:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/llm_api_key
  db_mcp_read_password:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/db_mcp_read_password
  db_mcp_sql_password:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/db_mcp_sql_password
  mcp_token:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/mcp_token
  eval_mcp_token:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/eval_mcp_token
  mcp_token_hermes:
    file: ${XD_SECRETS_DIR:?Run deploy/xd-up.sh}/mcp_token_hermes
