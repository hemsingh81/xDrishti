strategy:
  schema: 1
  id: BASE_BREAKOUT
  style: swing
  timeframes:
    - 1D
  sides:
    - BUY
  params:
    base_len: 20
    base_pct: 8
    vol_x: 1.5
    rr: 2
  setup:
    all:
      - "tf(\"1W\").close > tf(\"1W\").sma(10)"
      - "close > sma(50)"
      - "(highest(base_len, source=close) - lowest(base_len, source=close)) / lowest(base_len, source=close) * 100 <= base_pct"
      - "rel_volume(20) >= vol_x"
  trigger:
    all:
      - "close >= highest(base_len, source=close)"
  entry:
    type: at_close
  stop:
    type: swing_low
    lookback: base_len
  exits:
    - policy: FIXED_RR
      rr: [rr]
  time_rules:
    max_hold_sessions: 5
