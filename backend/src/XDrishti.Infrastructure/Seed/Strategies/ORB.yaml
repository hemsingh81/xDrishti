strategy:
  schema: 1
  id: ORB
  style: intraday
  timeframes:
    - 5m
    - 15m
  sides:
    - BUY
    - SELL
  params:
    or_min: 15
    rr: 2
  trigger:
    all:
      - "close > or_high(or_min) and close[1] <= or_high(or_min)"
  entry:
    type: at_close
  stop:
    type: or_opposite
    minutes: or_min
  exits:
    - policy: FIXED_RR
      rr: [rr]
  sell:
    trigger:
      all:
        - "close < or_low(or_min) and close[1] >= or_low(or_min)"
    entry:
      type: at_close
    stop:
      type: or_opposite
      minutes: or_min
    exits:
      - policy: FIXED_RR
        rr: [rr]
  time_rules:
    first_entry: "09:30"
    last_entry: "11:30"
    square_off: "15:15"
