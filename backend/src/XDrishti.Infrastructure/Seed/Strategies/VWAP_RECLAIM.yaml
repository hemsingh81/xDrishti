strategy:
  schema: 1
  id: VWAP_RECLAIM
  style: intraday
  timeframes:
    - 15m
  sides:
    - BUY
    - SELL
  params:
    rr: 2
  setup:
    all:
      - "tf(\"1D\").close > tf(\"1D\").ema(20)"
  trigger:
    all:
      - "close > vwap and close > open"
      - "close[1] < vwap[1] and close[2] < vwap[2]"
  entry:
    type: at_close
  stop:
    type: swing_low
    lookback: 3
  exits:
    - policy: FIXED_RR
      rr: [rr]
  sell:
    setup:
      all:
        - "tf(\"1D\").close < tf(\"1D\").ema(20)"
    trigger:
      all:
        - "close < vwap and close < open"
        - "close[1] > vwap[1] and close[2] > vwap[2]"
    entry:
      type: at_close
    stop:
      type: swing_high
      lookback: 3
    exits:
      - policy: FIXED_RR
        rr: [rr]
  time_rules:
    first_entry: "10:00"
    last_entry: "14:30"
    square_off: "15:15"
